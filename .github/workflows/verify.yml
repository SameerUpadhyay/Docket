name: Verify pilot
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: docket_test, POSTGRES_USER: docket, POSTGRES_PASSWORD: test_only_password}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U docket -d docket_test" --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      matrix: {database: [sqlite, postgres]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r backend/requirements.txt -r backend/tests/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
      - run: PYTHONPATH=backend python -m app.ocr.model_setup --destination .tools/tessdata
      - name: Unit and tenant security tests
        env:
          DATABASE_URL: "${{ matrix.database == 'postgres' && 'postgresql://docket:test_only_password@localhost:5432/docket_test' || '' }}"
          DATA_ENCRYPTION_KEY: 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
        run: PYTHONPATH=backend pytest -q backend/tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --prefix frontend
      - run: npm run typecheck && npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify downloadable APK
        run: |
          cd downloads/android
          sha256sum --check SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify docket-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging docket-debug.apk | grep -F "name='in.docket.app' versionCode='8' versionName='0.5.3-email-fixes'"
      - name: Build and test Android
        run: chmod +x android/gradlew && android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest --console=plain --no-daemon --max-workers=2
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docket-android-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with: {name: docket-debug, path: android/app/build/outputs/apk/debug/app-debug.apk}
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install cfn-lint==1.58.0
      - run: python scripts/aws_template.py && cfn-lint deploy/aws/cloudformation.json --regions ap-south-1
