# Private production pilot template. Copy deploy/production.env.example to
# .env.production, supply real settings, then use --env-file .env.production.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docket
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U docket -d docket"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    networks: [private]
    mem_limit: 2g
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      CLAMAV_HOST: clamav
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=512m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    networks: [private, outbound]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    command: [python, -m, app.workers.delivery]
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks: [private, outbound]
  email-worker:
    build: ./backend
    command: [python, -m, app.workers.email_ingestion]
    restart: unless-stopped
    env_file: .env.production
    environment:
      CLAMAV_HOST: clamav
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=512m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    networks: [private, outbound]
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    networks: [private]
    mem_limit: 1g
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOCKET_DOMAIN: ${DOCKET_DOMAIN:?Set DOCKET_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, outbound]
    depends_on: [web,api]
networks:
  private: {internal: true}
  outbound: {}
volumes:
  postgres-data: {}
  clamav-data: {}
  caddy-data: {}
  caddy-config: {}
